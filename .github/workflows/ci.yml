name: CI
on: [push, pull_request]

jobs:
  test:
    name: Dub Test
    strategy:
      matrix:
        os:
          - ubuntu-24.04
        dc:
          - dmd-2.112.0

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Before the matrix compiler: setup-dlang's $DC follows whichever
      # install ran last, and build/ci.sh relies on $DC being the matrix
      # dmd. Preserve LDC's absolute path for build/bench.sh before the
      # second setup changes the active compiler environment.
      - name: Install ldc (for the bench)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Record ldc path
        run: |
          echo "LDC=$DC" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ldc-bin"
          ln -s "$DC" "$RUNNER_TEMP/ldc-bin/ldc"
          echo "$RUNNER_TEMP/ldc-bin" >> "$GITHUB_PATH"

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Set up uv
        if: matrix.os == 'ubuntu-24.04'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Run CI
        run: build/ci.sh
