name: CI
on: [push, pull_request]

jobs:
  test:
    name: Dub Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The REPL links GNU readline for interactive line editing.
      # build/ut-without-build-tools.sh runs bin/ut under strace.
      # reggaefile.d applies the patch of LDC's frontend additions with patch.
      # A failed install is fine when the machine already has what is needed.
      - name: Install libreadline, strace and patch
        run: build/ci-install-packages.sh

      - name: Run CI
        run: build/ci.sh

      # build/ci.sh ran the unit tests with the JIT at its default threshold.
      # These runs cover the handlers alone, and the JIT code of every
      # function (the test hook makes a function hot at its first event).
      - name: Unit tests without the JIT
        run: build/ut-without-build-tools.sh --no-jit

      - name: Unit tests with the JIT at the minimum threshold
        run: build/ut-without-build-tools.sh --eager-jit

      # kcov was dropped from Ubuntu's repos, so it has to be built
      # from source. Cached by version: bump the "kcov-43" cache key
      # (and the --branch below) together to pick up a new release.
      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ~/kcov-install
          key: kcov-43-ubuntu-24.04

      - name: Build kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libdw-dev binutils-dev libcurl4-openssl-dev zlib1g-dev
          git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -DCMAKE_INSTALL_PREFIX="$HOME/kcov-install"
          cmake --build /tmp/kcov-build --parallel
          cmake --install /tmp/kcov-build

      - name: Add kcov to PATH
        run: echo "$HOME/kcov-install/bin" >> "$GITHUB_PATH"

      - name: Coverage
        run: build/coverage.sh

      - uses: codecov/codecov-action@v5.1.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/ldc-bytecode.info
