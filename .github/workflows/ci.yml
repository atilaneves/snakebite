name: CI
on: [push, pull_request]

jobs:
  test:
    name: Dub Test
    strategy:
      matrix:
        os:
          - ubuntu-24.04
        dc:
          - dmd-2.112.0

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Before the matrix compiler: setup-dlang's $DC follows whichever
      # install ran last, and build/ci.sh relies on $DC being the matrix
      # dmd. Preserve LDC's absolute path for build/bench.sh before the
      # second setup changes the active compiler environment.
      - name: Install ldc (for the bench)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Record ldc path
        run: |
          echo "LDC=$DC" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ldc-bin"
          ln -s "$DC" "$RUNNER_TEMP/ldc-bin/ldc"
          echo "$RUNNER_TEMP/ldc-bin" >> "$GITHUB_PATH"

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Set up uv
        if: matrix.os == 'ubuntu-24.04'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The REPL links GNU readline for interactive line editing.
      - name: Install libreadline
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev

      - name: Run CI
        run: build/ci.sh

      # kcov was dropped from Ubuntu's repos, so it has to be built
      # from source. Cached by version: bump the "kcov-43" cache key
      # (and the --branch below) together to pick up a new release.
      - name: Cache kcov
        id: cache-kcov
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/cache@v4
        with:
          path: ~/kcov-install
          key: kcov-43-${{ matrix.os }}

      - name: Build kcov
        if: matrix.os == 'ubuntu-24.04' && steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libdw-dev binutils-dev libcurl4-openssl-dev zlib1g-dev
          git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -DCMAKE_INSTALL_PREFIX="$HOME/kcov-install"
          cmake --build /tmp/kcov-build --parallel
          cmake --install /tmp/kcov-build

      - name: Add kcov to PATH
        if: matrix.os == 'ubuntu-24.04'
        run: echo "$HOME/kcov-install/bin" >> "$GITHUB_PATH"

      - name: Coverage
        if: matrix.os == 'ubuntu-24.04'
        run: build/coverage.sh

      - if: matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@v5.1.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
